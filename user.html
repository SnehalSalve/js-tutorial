<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let entries = [];

        function demo() {
            var a = document.getElementById("txt1").value;
            var b = document.getElementById("txt2").value;
            var c = document.getElementById("txt3").value;
            var d = document.getElementById("txt4").value;

            if (a && b && c && d) {
                entries.push({ firstName: a, lastName: b, city: c, country: d });
                renderTable();
                cleardata();
            } else {
                alert("All fields are required!");
            }
        }

        function cleardata() {
            document.getElementById("txt1").value = "";
            document.getElementById("txt2").value = "";
            document.getElementById("txt3").value = "";
            document.getElementById("txt4").value = "";
        }

        function renderTable() {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            entries.forEach((entry, index) => {
                const row = `
                    <tr>
                        <td>${entry.firstName}</td>
                        <td>${entry.lastName}</td>
                        <td>${entry.city}</td>
                        <td>${entry.country}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteEntry(${index})">Delete</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function deleteEntry(index) {
            entries.splice(index, 1);
            renderTable();
        }
    </script>
    <style>
        .input-group {
            width: 350px; /* Adjust width as needed */
            margin: 0 auto;
        }
        .form-label {
            margin-bottom: 50px; /* Adjust spacing as needed */
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="text-center">
            <div class="input-group mb-3">
                <label for="txt1" class="form-label mb-1">First Name</label>
                <input type="text" id="txt1" class="form-control">
            </div>
            <div class="input-group mb-3">
                <label for="txt2" class="form-label mb-1">Last Name</label>
                <input type="text" id="txt2" class="form-control">
            </div>
            <div class="input-group mb-3">
                <label for="txt3" class="form-label mb-1">City</label>
                <input type="text" id="txt3" class="form-control">
            </div>
            <div class="input-group mb-3">
                <label for="txt4" class="form-label mb-1">Country</label>
                <input type="text" id="txt4" class="form-control">
            </div>
            <div>
                <button class="btn btn-success" onclick="demo()">Register</button>
                <button class="btn btn-danger" onclick="cleardata()">Cancel</button>
            </div>
        </div>
        <div class="mt-4 text-center">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>First Name </th>
                        <th>Last Name </th>
                        <th>City </th>
                        <th>Country </th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Rows will be dynamically added here -->
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
