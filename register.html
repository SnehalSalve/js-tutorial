<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        function demo() {
            var firstname = document.getElementById("txt1").value;
            var lastname = document.getElementById("txt2").value;
            var mobile = document.getElementById("txt3").value;
            var emailid = document.getElementById("txt4"). value;
            var password = document.getElementById("txt5").value;
            var conpassword = document.getElementById("txt6").value;


            document.write("first name is : " + firstname + "<br>");

            document.write("last name is : " + lastname + "<br>");

            document.write("mobile no is : " + mobile + "<br>");

            document.write("email is : " + emailid + "<br>");

            document.write("password is : " + password + "<br>");
            document.write("password is : " + conpassword + "<br>");

        }
    </script>
</head>
<body>
    <div>
        <div>
            <label for="">First Name</label>
            <input type="text" id="txt1">
        </div>

        <div>
            <label for="">Last Name</label>
            <input type="text" id="txt2">
        </div>

        <div>
            <label for="">Mobile no</label>
            <input type="number" id="txt3">
        </div>
        <div>
            <label for="">Email id</label>
            <input type="email" id="txt4">
        </div>
        <div>
            <label for="">Password</label>
            <input type="password" id="txt5">
        </div>
        <div>
            <label for="">Confirm Password</label>
            <input type="password" id="txt6">
        </div>

        <div>
            <button class="btn btn-success" onclick="demo()">Register</button>
            <button class="btn btn-danger" onclick="demo()">Cancel</button>
        </div>
    </div>
</body>
</html>
