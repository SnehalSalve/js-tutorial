<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function demo() {
            var a = document.getElementById("txt1").value;
            var b = document.getElementById("txt2").value;
            var c = document.getElementById("txt3").value;
            var d = document.getElementById("txt4").value;

            document.getElementById("t1").innerHTML = a;
            document.getElementById("t2").innerHTML = b;
            document.getElementById("t3").innerHTML = c;
            document.getElementById("t4").innerHTML = d;
        }

        function cleardata() {
            document.getElementById("txt1").value = "";
            document.getElementById("txt2").value = "";
            document.getElementById("txt3").value = "";
            document.getElementById("txt4").value = "";
        }
    </script>
    <style>
        .input-group {
            width: 350px; /* Adjust width as needed */
            margin: 0 auto;
        }
        .form-label {
            margin-bottom: 50px; /* Adjust spacing as needed */
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="text-center">
            <div class="input-group mb-3">
                <label for="txt1" class="form-label mb-1">First Name</label>
                <input type="text" id="txt1" class="form-control">
            </div>
            <div class="input-group mb-3">
                <label for="txt2" class="form-label mb-1">Last Name</label>
                <input type="text" id="txt2" class="form-control">
            </div>
            <div class="input-group mb-3">
                <label for="txt3" class="form-label mb-1">City</label>
                <input type="text" id="txt3" class="form-control">
            </div>
            <div class="input-group mb-3">
                <label for="txt4" class="form-label mb-1">Country</label>
                <input type="text" id="txt4" class="form-control">
            </div>
            <div>
                <button class="btn btn-success" onclick="demo()">Register</button>
                <button class="btn btn-danger" onclick="cleardata()">Cancel</button>
            </div>
        </div>
        <div class="mt-4 text-center">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>First Name </th>
                        <th>Last Name </th>
                        <th>City </th>
                        <th>Country </th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="t1"></td>
                        <td id="t2"></td>
                        <td id="t3"></td>
                        <td id="t4"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
