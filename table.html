<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        function demo(){
            var firstname = document.getElementById("txt1").value;
            var lastname = document.getElementById("txt2").value;
         
            document.write("<h1>Student Data</h1>");
            document.write("<table border=1>");
            document.write("<thead><th>Name</th><th>Name</th></thead>");
            document.write("<tr>");
            document.write("<td>");
            document.write(firstname);
            document.write("</td>");
            document.write("<td>");
            document.write(lastname);
            document.write("</td>");

        }
    </script>
</head>
<body>
    
    <div>
        <div>
            <label for="">First Name</label>
            <input type="text" id="txt1">
        </div>

        <div>
            <label for="">Last Name</label>
            <input type="text" id="txt2">
        </div>
        <div>
            <button class="btn btn-success" onclick="demo()">Register</button>
            <button class="btn btn-danger" onclick="demo()">Cancel</button>
        </div>
    </div>
</body>
</html>
